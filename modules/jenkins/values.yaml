controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.462.3-jdk17"
  
  admin:
    username: admin
    password: admin123

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  persistentVolume:
    enabled: true
    storageClass: "gp3"
    size: 10Gi

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - ws-cleanup:latest
    - kubernetes-credentials-provider:latest

  JCasC:
    configScripts:
      welcome-message: |
        jenkins:
          systemMessage: "Jenkins configured automatically by JCasC"
      global-environment: |
        jenkins:
          globalNodeProperties:
            - envVars:
                env:
                  - key: ECR_REGISTRY
                    value: "${ECR_REPOSITORY_URL}"
                  - key: AWS_ACCOUNT_ID
                    value: "666834592660"
                  - key: AWS_DEFAULT_REGION
                    value: "eu-central-1"